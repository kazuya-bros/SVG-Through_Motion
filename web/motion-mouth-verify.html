<!doctype html><meta charset="utf-8"><title>編集後の口パクを検証</title><pre id="result">検証中…</pre><iframe id="app" style="width:1100px;height:850px" src="/?project=e6a4edc42bbd4ab286454ed9f68ef55c"></iframe>
<script type="module">
const frame=document.querySelector('#app'),out=document.querySelector('#result'),logs=[],wait=ms=>new Promise(r=>setTimeout(r,ms));
const check=(ok,label)=>{if(!ok)throw Error(label);logs.push('PASS '+label);out.textContent=logs.join('\n');};
try{
 for(let i=0;i<300&&!frame.contentDocument?.querySelector('canvas.rig-preview');i++)await wait(100);
 const w=frame.contentWindow,d=frame.contentDocument,$=id=>d.getElementById(id);
 const input=(id,value)=>{if($(id).type==='checkbox')$(id).checked=value;else $(id).value=value;$(id).dispatchEvent(new w.Event(id==='rigEnabled'?'change':'input',{bubbles:true}));};
 check(+$('mouth').value===1,'目の編集では開き口100%を確認');
 d.querySelector('[data-tab="motion"]').click();check(+$('mouth').value===0&&$('talking').checked,'モーション移動で編集値を解除、口パクONを保持');
 input('rigEnabled',false);for(const id of ['sway','breathe','hair','chest','ears'])input(id,0);input('blink',false);input('singleBounce',false);input('duration',4);
 input('scrubber',0);await wait(900);
 const pixels=()=>$('artboard').querySelector('canvas.rig-preview').toDataURL();
 const closed=pixels();input('scrubber',.125);await wait(160);const opened=pixels();
 check(opened!==closed,'ループの開口時刻で実際の描画が変化');input('scrubber',.375);await wait(160);check(pixels()===closed,'閉口時刻で口を閉じる');
 input('talking',false);input('scrubber',.125);await wait(160);check(pixels()===closed,'口パクOFFでは閉口を維持');
 d.querySelector('[data-tab="edit"]').click();$('editNext').click();for(let i=0;i<200&&!$('mouthPreparing').hidden;i++)await wait(100);
 d.querySelector('#mouthGuide [data-start]').click();input('mouth',1);check(+$('mouth').value===1,'口編集の途中確認を100%に変更');
 $('editNext').click();check(+$('mouth').value===0&&!$('talking').checked,'口編集終了でも固定解除、OFF設定を保持');
 input('talking',true);input('scrubber',.125);await wait(250);check(pixels()!==closed,'口編集後もONにすると開口する');
 input('scrubber',.375);await wait(160);check(pixels()===closed,'口編集後も閉口する');
 $('play').click();const time=$('timeValue').textContent;await wait(220);check($('timeValue').textContent!==time,'再生ボタンで口パクの時間が進む');
 document.body.dataset.result='pass';
}catch(e){out.textContent+='\nFAIL '+e.stack;document.body.dataset.result='fail';}
</script>

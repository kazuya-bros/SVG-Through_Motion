<!doctype html><meta charset="utf-8"><title>出力ウィンドウ設定の検証</title><style>body{font:14px system-ui}iframe{width:960px;height:900px}pre{white-space:pre-wrap}</style><pre id="result">検証中…</pre><iframe id="app" src="/?project=4870c15777ab424cbd4577f5e5d26924"></iframe>
<script type="module">
const f=document.querySelector('#app'),out=document.querySelector('#result'),wait=ms=>new Promise(r=>setTimeout(r,ms)),lines=[];
const check=(ok,label)=>{if(!ok)throw Error(label);lines.push('PASS '+label);out.textContent=lines.join('\n');};
try{
 for(let i=0;i<300&&!f.contentDocument?.querySelector('.eye-pick');i++)await wait(100);
 const w=f.contentWindow,d=f.contentDocument,$=id=>d.getElementById(id),visible=e=>!!e?.getClientRects().length;
 $('workspaceMode').click();
 check(visible($('runtimeTts-engine'))&&visible($('runtimeTts-sbvSettings')),'出力設定のエンジンと声が表示される');
 check(d.querySelectorAll('#runtimeTts-engine option').length===5,'既存の5音声エンジンを選べる');
 const ids=[...d.querySelectorAll('[id]')].map(e=>e.id);check(new Set(ids).size===ids.length,'作成用と出力用でIDが重複しない');
 const before=$('engine').value;$('runtimeTts-engine').value='browser';$('runtimeTts-engine').dispatchEvent(new w.Event('change',{bubbles:true}));
 check(visible($('runtimeTts-ttsVoice'))&&!visible($('runtimeTts-connectTts')),'ブラウザ音声では外部エンジン接続を表示しない');
 check($('engine').value===before,'出力用の声選択で作成側の音声設定を変えない');
 check(!$('editorOutputDetails').open&&visible($('outputLaunch')),'通常の入口は出力ウィンドウを開く一つ');
 check($('tab-live').scrollWidth<=$('tab-live').clientWidth+1,'960px幅で出力設定が横にはみ出さない');
 $('workspaceMode').click();d.querySelector('[data-tab=motion]').click();$('exportTop').click();$('workspaceMode').click();
 check(visible($('runtimeTts-engine'))&&visible($('runtimeTts-ttsVoice')),'書き出し画面を経由しても音声選択が消えない');
 document.body.dataset.result='pass';
}catch(e){out.textContent+='\nFAIL '+e.stack;document.body.dataset.result='fail';}
</script>

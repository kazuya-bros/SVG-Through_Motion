<!doctype html><html lang="ja"><meta charset="utf-8"><title>Import flow verification</title>
<style>body{font:14px system-ui;margin:20px}pre{white-space:pre-wrap}iframe{width:1100px;height:800px;border:1px solid #ddd}</style>
<h1>導入・差分確認フローの検証</h1><pre id="result">検証中…</pre><iframe id="app" src="/"></iframe>
<script type="module">
const log=[],output=document.querySelector('#result'),frame=document.querySelector('#app');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const check=(ok,name)=>{if(!ok)throw Error(name);log.push('PASS '+name);output.textContent=log.join('\n');};
const until=async f=>{for(let i=0;i<300;i++){if(f())return;await wait(100);}throw Error('画面の準備がタイムアウト');};
try{
 await until(()=>frame.contentDocument?.querySelector('#eyesReviewCard'));
 let w=frame.contentWindow,d=frame.contentDocument,$=id=>d.getElementById(id);
 const choose=(id,value)=>{$(id).value=value;$(id).dispatchEvent(new w.Event('change',{bubbles:true}));};
 check($('faceDonorOptions').hidden&&$('donor-eyes_closed').disabled&&!$('donor-eyes_closed').required,'基本モードでは追加PSDを要求しない');
 d.querySelector('[name=importMode][value=donors]').click();
 check(!$('faceDonorOptions').hidden&&$('donor-eyes_closed').required&&$('donor-mouth_closed').required,'差分モードでは選んだ部位のPSDを要求');
 const dt=new w.DataTransfer();dt.items.add(new w.File(['fixture'],'closed.psd'));$('donor-eyes_closed').files=dt.files;
 choose('mouthSource','psd');
 check($('donor-mouth_closed').required&&!$('mouthSource').querySelector('[value=same]'),'口のPSDは独立した選択欄で指定');
 $('donor-mouth_closed').files=dt.files;
 const flow=await w.eval("import('/web/import-flow.js')");
 check(flow.installImportFlow().files().mouth_closed.name==='closed.psd','同じPSDを両方の欄で選べる');
 choose('eyeSource','auto');
 check($('mouthSource').value==='psd'&&!$('donor-mouth_closed').disabled,'目の変更は口のPSD選択に影響しない');

 check($('importResultHint').textContent.includes('目は下書きを調整、口は開閉を確認'),'片方だけの差分にも個別の案内');
 d.querySelector('[name=importMode][value=basic]').click();
 check(Object.keys(flow.installImportFlow().files()).length===0,'基本に戻すと以前の差分は送信しない');
 frame.src='/?project=c26d17f5b56a40818e2adaf3626b51d9';
 await wait(300);await until(()=>frame.contentDocument?.querySelector('canvas.rig-preview'));
 w=frame.contentWindow;d=frame.contentDocument;$=id=>d.getElementById(id);await wait(400);
 const slide=async(id,value)=>{$(id).value=value;$(id).dispatchEvent(new w.Event('input',{bubbles:true}));await wait(100);};
 const fix=(step,kind)=>{const guide=$(step+'Guide');if(d.body.dataset[step==='eyes'?'eyeReview':'mouthReview']==='true')guide.querySelector('[data-start]').click();guide.querySelector('[data-tool='+ (kind==='contour'?'contour':'transform') +']').click();};
 check($('taskTitle').textContent==='瞬きを確認'&&d.body.dataset.eyeReview==='true','差分の目も最初は瞬きの確認');
 const range=$('editEyeClosure').getBoundingClientRect(),sr=$('stage').getBoundingClientRect();
 check(range.width>400&&range.y>=sr.bottom&&$('eyesPreviewControl').getClientRects().length&&!$('eyesStartClosed'),'大きなスライダーを作業エリアの下に最初から表示');
 check(+$('editEyeClosure').value===0&&!$('eyeEditorMount').getClientRects().length,'開き目から開始して数値欄を隠す');
 const count=$('stage').dataset.drawCount;await slide('editEyeClosure',1);
 check($('stage').dataset.drawCount!==count&&$('eyeClosureOut').value==='100%'&&!$('eyeDirectSvg')?.querySelector('.transform-handle'),'スライダーだけで閉じ目を描画、編集枠はまだ出さない');
 await slide('editEyeClosure',0);check($('eyeClosureOut').value==='0%','閉じるから開くへ戻して瞬きを確認できる');
 fix('eyes','position');await wait(120);
 check(d.body.dataset.eyeReview==='false'&&+$('editEyeClosure').value===.78&&$('eyeDirectSvg').querySelector('[data-handle]')&&$('eyesGuide').querySelector('.tool-help').textContent.includes('枠の中'),'位置の補正を選ぶと重ね表示と移動の操作案内を出す');
 fix('eyes','size');check($('eyesGuide').querySelector('.tool-help').textContent.includes('四角'),'長さの補正は左右のハンドルを案内');
 fix('eyes','angle');check($('eyesGuide').querySelector('.tool-help').textContent.includes('上の丸'),'傾きの補正は回転のハンドルを案内');
 await slide('editEyeClosure',0);check(!$('eyesGuide').querySelector('[data-pose=blend]').hidden,'補正中もスライダー確認でき、補正へ戻る入口を表示');
 $('eyesGuide').querySelector('[data-pose=blend]').click();await wait(100);check(+$('editEyeClosure').value===.78,'補正へ戻ると編集用の開き度に戻る');
 $('eyesAdjustDonor').click();await wait(100);check(d.body.dataset.eyeReview==='true'&&!$('eyeEditorMount').getClientRects().length,'補正完了で瞬きの確認へ戻る');
 $('editNext').click();await until(()=>$('mouthWorkbench')&&!$('mouthWorkbench').hidden&&$('mouthPreparing').hidden);await wait(100);
 check($('taskTitle').textContent==='口の開閉を確認'&&$('mouthPreviewControl').getClientRects().length&&!$('eyesPreviewControl').getClientRects().length&&+$('mouth').value===1,'口に進むと作業エリアの下も口のスライダーに切り替わる');
 await slide('mouth',0);check($('mouthOut').value==='0%'&&w.getComputedStyle($('mouthDirectHandles')).display==='none','口もスライダーから開閉を確認');
 fix('mouth','size');await wait(120);check(+$('mouth').value===.06&&w.getComputedStyle($('mouthDirectHandles')).display!=='none'&&$('mouthGuide').querySelector('.tool-help').textContent.includes('四角'),'口の幅を選ぶと6%重ね表示と変形枠を出す');
 $('mouthAdjustDonor').click();await wait(100);check(d.body.dataset.mouthReview==='true','口も補正後に開閉の確認へ戻る');
 $('editNext').click();check(!$('mouthPreviewControl').getClientRects().length&&!$('eyesPreviewControl').getClientRects().length,'モーション工程には編集用スライダーを出さない');
 frame.src='/?project=2c4f269e67f64ece858cf66d328ae666';await wait(300);await until(()=>frame.contentDocument?.querySelector('canvas.rig-preview'));
 w=frame.contentWindow;d=frame.contentDocument;$=id=>d.getElementById(id);await wait(300);
 check(d.body.dataset.eyeReview==='true'&&!$('eyeEditorMount').getClientRects().length,'下書きの閉じ目も補正を強制せず瞬きの確認から開始');
 fix('eyes','contour');await wait(100);check(d.body.dataset.shapeTool==='contour'&&$('eyeDirectSvg').querySelector('circle'),'下書きはカーブ補正を選んで線を直接編集できる');
 $('editNext').click();await until(()=>$('mouthWorkbench')&&!$('mouthWorkbench').hidden&&$('mouthPreparing').hidden);fix('mouth','contour');await wait(150);
 check(d.body.dataset.shapeTool==='contour'&&w.getComputedStyle($('mouthDirectHandles')).display!=='none','下書きの口も選んだ補正ツールに切り替わる');
 document.body.dataset.result='pass';
}catch(e){log.push('FAIL '+e.message);output.textContent=log.join('\n');document.body.dataset.result='fail';}
</script></html>

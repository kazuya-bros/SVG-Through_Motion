<!doctype html><html lang="ja"><meta charset="utf-8"><title>素材読み込み3ステップの確認</title>
<style>body{font:14px system-ui}iframe{width:1000px;height:850px}pre{white-space:pre-wrap}</style><pre id="result">確認中…</pre><iframe id="app" src="/#materials"></iframe>
<script type="module">
const f=document.querySelector('#app'),out=document.querySelector('#result'),wait=ms=>new Promise(r=>setTimeout(r,ms)),log=[];
const until=async fn=>{for(let i=0;i<200;i++){if(fn())return;await wait(100);}throw Error('タイムアウト');};
const check=(ok,label)=>{if(!ok)throw Error(label);log.push('PASS '+label);out.textContent=log.join('\n');};
try{
 await until(()=>f.contentDocument?.querySelector('#assistEntry'));
 const d=f.contentDocument,w=f.contentWindow,$=id=>d.getElementById(id),visible=e=>!!e.getClientRects().length,form=$('importForm');
 const file=(id,name)=>{const transfer=new w.DataTransfer();transfer.items.add(new w.File(['fixture'],name));$(id).files=transfer.files;$(id).dispatchEvent(new w.Event('input',{bubbles:true}));};
 const select=(id,value)=>{$(id).value=value;$(id).dispatchEvent(new w.Event('change',{bubbles:true}));};
 const go=step=>d.querySelector(`[data-import-step="${step}"]`).click();
 let submissions=0;form.addEventListener('submit',e=>{e.preventDefault();e.stopImmediatePropagation();submissions++;},true);
 check(visible($('importStep1'))&&!visible($('hybridOriginal'))&&!visible($('quality'))&&!visible($('hybridImport')),'STEP 1は素材の種類だけを表示');
 form.requestSubmit();check(visible($('importStep2'))&&submissions===0,'途中のEnterでは変換せず次のSTEPへ進む');
 check(!visible($('faceDonorOptions'))&&$('donor-eyes_closed').disabled,'基本素材では差分を要求しない');
 go(3);check(visible($('importStep2'))&&!$('importStepError').hidden,'STEP 3への直接移動でも不足ファイルを確認');
 check(!$('openFeatures')&&!!d.querySelector('.import-caution'),'注意文を残し、確認チェックを要求しない');
 file('hybridOriginal','wrong.txt');file('hybridPsd','base.psd');$('importNext').click();
 check(visible($('importStep2'))&&$('importStepError').textContent.includes('PNG'),'元絵の拡張子をファイル選択のSTEPで確認');
 file('hybridOriginal','original.png');$('importNext').click();
 check(visible($('importStep3'))&&visible($('quality'))&&visible($('assistEntry'))&&visible($('hybridImport'))&&!visible($('hybridOriginal')),'STEP 3で品質・手動／AI・開始ボタンを表示');
 check(!$('alphaThreshold').closest('details').open,'専門的な変換設定は初期状態で折りたたむ');
 $('alphaThreshold').value='999';form.requestSubmit();
 check(submissions===0&&$('alphaThreshold').closest('details').open,'不正な変換設定は折りたたみを開いて案内');
 $('alphaThreshold').value='12';form.requestSubmit();check(submissions===1,'有効な基本素材は最後のSTEPからのみ送信できる');
 go(1);d.querySelector('[name=importMode][value=donors]').click();$('importNext').click();
 check(visible($('faceDonorOptions'))&&$('hybridOriginal').files[0].name==='original.png','差分ありへ変更しても元絵とPSDの選択を維持');
 go(3);check(visible($('importStep2')),'必要な差分PSDがなければ先へ進めない');
 file('donor-eyes_closed','closed.psd');go(3);
 check(visible($('importStep2'))&&!$('mouthSource').querySelector('[value=same]'),'目のPSDを選んでも口は別途選択が必要');
 file('donor-mouth_closed','closed.psd');go(3);
 check(visible($('importStep3'))&&!$('donor-mouth_closed').disabled,'同じPSDでも目と口の両欄で選べる');
 go(1);d.querySelector('[name=importMode][value=basic]').click();go(3);form.requestSubmit();
 check(submissions===2&&$('donor-eyes_closed').disabled&&$('donor-eyes_closed').files.length===1,'基本素材に戻すと差分は保持しつつ送信対象から外す');
 d.querySelector('[name=assistEntryMode][value=ai]').click();check($('hybridImport').textContent.includes('AI')&&!d.querySelector('[data-ai-options]').hidden,'最終STEPからAIへ渡す選択も利用できる');
 d.querySelector('[data-source-page=resume]').click();check(visible($('projectInput'))&&!visible(form),'保存済みプロジェクトの再開は別の入口を維持');
 d.querySelector('[data-source-page=new]').click();
 for(const width of [1000,390]){f.style.width=width+'px';for(const step of [1,2,3]){go(step);await wait(100);check(d.documentElement.scrollWidth<=d.documentElement.clientWidth+1,`${width}pxのSTEP ${step}で横にはみ出さない`);}}
 go(1);out.textContent+='\nDONE';
}catch(e){out.textContent+='\nFAIL '+e.stack;}
</script></html>

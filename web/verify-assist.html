<!doctype html><meta charset="utf-8"><title>Assist rendering verification</title>
<style>body{font:16px sans-serif;background:#eee}canvas{border:1px solid #aaa;margin:8px;max-width:45%}pre{white-space:pre-wrap}</style>
<h1>Assist rendering verification</h1><pre id="result">Running</pre><div id="images"></div>
<script type="module">
import {prepareCanvasRenderer} from './canvas-renderer.js';
import {reviewPoses,renderCorrectionReview} from './review-renderer.js';
const sid=new URLSearchParams(location.search).get('session');
try{
const state=await (await fetch('/api/assist/sessions/'+sid)).json(),project=state.state.session.base;
const poses=reviewPoses(project.settings),renderer=await prepareCanvasRenderer(project,384);
const captures=[];
for(const i of [4,5,6,7]){renderer.draw(poses[i].pose);const c=document.createElement('canvas');c.width=renderer.canvas.width;c.height=renderer.canvas.height;c.getContext('2d').drawImage(renderer.canvas,0,0);document.querySelector('#images').append(c);captures.push(c.getContext('2d').getImageData(75,125,175,40).data);}
const review=await renderCorrectionReview(project,project),checks=[];
for(const i of [4,5,6,7]){const bitmap=await createImageBitmap(review.pages[i].blob),c=document.createElement('canvas');c.width=bitmap.width;c.height=bitmap.height;c.getContext('2d').drawImage(bitmap,0,0);document.querySelector('#images').append(c);checks.push(c.getContext('2d').getImageData(75,157,175,40).data);bitmap.close();}
document.querySelector('#result').textContent=JSON.stringify({eyePixelsUnchanged:captures.every(a=>a.every((v,i)=>v===captures[0][i])),reviewEyePixelsUnchanged:checks.every(a=>a.every((v,i)=>v===checks[0][i]))},null,2);
renderer.dispose();
}catch(e){document.querySelector('#result').textContent=e.stack;}
</script>

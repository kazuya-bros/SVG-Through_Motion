<!doctype html><meta charset="utf-8"><title>描画元の確認</title>
<style>body{font:16px sans-serif;background:#eee}pre{white-space:pre-wrap}main{display:flex;gap:12px}figure{margin:0;background:white;flex:1}img{width:100%}</style>
<h1>PSD画質の読み込み確認</h1><pre id="result">確認中</pre><main></main>
<script type="module">
import {sanitizeSvg} from './assets.js';
import {svgSignature,rasterProject} from './raster-source.js';
const p=await (await fetch('./samples/teth/project.json')).json();
const rows=[];
for(const [i,part] of p.parts.entries()){
 const raw=part.svgText;part.svgText=sanitizeSvg(raw,`qa${i}-`);
 if(!part.artworkSource)continue;
 rows.push({name:part.name,rawMatch:await svgSignature(raw)===part.rasterSignature,loadedMatch:await svgSignature(part.svgText)===part.rasterSignature});
}
const rendered=await rasterProject(p);
for(const row of rows){const part=rendered.parts.find(x=>x.name===row.name);row.usesOriginal=part.svgText.includes('<image ');}
document.querySelector('#result').textContent=JSON.stringify(rows,null,2);
const back=p.parts.find(x=>x.name==='後ろ髪');
for(const [label,url] of [['読み込み後の表示',URL.createObjectURL(new Blob([rendered.parts.find(x=>x.id===back.id).svgText],{type:'image/svg+xml'}))],['PSDの元画質',back.artworkSources.psd.originalUrl]]){
 const figure=document.createElement('figure'),caption=document.createElement('figcaption'),img=new Image();caption.textContent=label;img.src=url;figure.append(caption,img);document.querySelector('main').append(figure);
}
</script>

<!doctype html><meta charset="utf-8"><title>口の形編集の確認</title><pre id="result">確認中</pre><div id="pictures"></div><script type="module">
import {prepareCanvasRenderer} from './canvas-renderer.js?v=mouth-editor-9';
import {sceneSvg,applyPose,animatedSvg} from './motion.js?v=mouth-editor-9';
import {normalizeMouthTuning} from './vowels.js';
const log=t=>document.querySelector('#result').textContent+='\n'+t;
async function save(blob,name){const r=await fetch('/api/exports/'+name,{method:'POST',body:blob});if(!r.ok)throw Error(await r.text());const v=await r.json();log(v.url);return v;}
try{
 const id=new URLSearchParams(location.search).get('project'),p=await(await fetch('/api/exports/'+id+'/khaula-motion.project.json')).json();
 const r=await prepareCanvasRenderer(p,1024),sheet=document.createElement('canvas');sheet.width=1200;sheet.height=460;const c=sheet.getContext('2d');c.fillStyle='white';c.fillRect(0,0,1200,460);c.font='20px sans-serif';
 for(const [i,vowel] of ['closed','a','i','u','e','o'].entries()){
  r.draw({mouth:vowel==='closed'?0:1,vowel,blinkL:0,blinkR:0});const x=i%3*400,y=Math.floor(i/3)*230;c.drawImage(r.canvas,430,365,180,90,x,y+40,400,190);c.fillStyle='#31533b';c.fillText(['閉じ口','あ','い','う','え','お'][i],x+15,y+25);
 }
 document.querySelector('#pictures').append(sheet);await save(await new Promise(r=>sheet.toBlob(r)),'mouth-shape-controls.png');
 const q=structuredClone(p);q.parts=q.parts.filter(p=>p.role==='mouth');q.settings={...q.settings,rigEnabled:false,background:'transparent'};q.settings.mouthTuning=normalizeMouthTuning(q.settings.mouthTuning);
 Object.assign(q.settings.mouthTuning.closed,{angle:-12,width:1.2,curve:2,thickness:1.5});Object.assign(q.settings.mouthTuning.vowels.i,{x:3,y:-2,angle:14});
 const qr=await prepareCanvasRenderer(q,1024);
 const bounds=c=>{const a=c.getContext('2d').getImageData(0,0,1024,1024).data;let xs=1024,ys=1024,xe=-1,ye=-1;for(let y=0;y<1024;y++)for(let x=0;x<1024;x++)if(a[(y*1024+x)*4+3]>32){xs=Math.min(xs,x);ys=Math.min(ys,y);xe=Math.max(xe,x);ye=Math.max(ye,y);}return [xs,ys,xe,ye];};
 for(const pose of [{mouth:0},{mouth:.09,vowel:'i'},{mouth:1,vowel:'i'},{mouth:1,vowel:'u'},{mouth:.7,vowelWeights:[0,.5,.5,0,0]}]){
  qr.draw(pose);const root=new DOMParser().parseFromString(sceneSvg(q,q.settings,false),'image/svg+xml').documentElement;applyPose(root,pose,q);
  const im=new Image(),url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(root)],{type:'image/svg+xml'}));im.src=url;await im.decode();const canvas=document.createElement('canvas');canvas.width=canvas.height=1024;canvas.getContext('2d').drawImage(im,0,0);URL.revokeObjectURL(url);
  const a=bounds(qr.canvas),b=bounds(canvas);if(a.some((v,i)=>Math.abs(v-b[i])>2))throw Error('境界差 '+JSON.stringify(pose)+' '+a+' / '+b);
  // Compare the cavity's color too, so a missing tooth overlay cannot pass by bounds alone.
  const ca=qr.canvas.getContext('2d').getImageData(480,380,110,80).data,cb=canvas.getContext('2d').getImageData(480,380,110,80).data;let sum=0;
  for(let i=0;i<ca.length;i+=4)for(let k=0;k<3;k++)sum+=Math.abs(ca[i+k]*ca[i+3]/255-cb[i+k]*cb[i+3]/255);
  const error=sum/(110*80*3);if(error>4)throw Error('描画色差 '+error);log('PASS Canvas/SVG '+JSON.stringify(pose)+' 平均色差 '+error.toFixed(3));
 }
 const xml=animatedSvg(q,q.settings,s=>new DOMParser().parseFromString(s,'image/svg+xml').documentElement);if(xml.includes('type="matrix"'))throw Error('非対応のSMIL変換');await save(new Blob([xml],{type:'image/svg+xml'}),'mouth-editor-loop.svg');
 log('ALL PASS');
}catch(e){log('FAIL '+e.stack);}
</script>

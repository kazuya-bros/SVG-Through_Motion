<!doctype html><meta charset="utf-8"><title>差分素材の編集UIを検証</title>
<style>body{font:14px system-ui;margin:8px}iframe{width:1100px;height:900px;border:1px solid #ccc}pre{white-space:pre-wrap}</style>
<pre id="result">検証中…</pre><iframe id="app"></iframe>
<script type="module">
const f=document.querySelector('#app'),out=document.querySelector('#result'),wait=ms=>new Promise(r=>setTimeout(r,ms)),lines=[];
const check=(ok,label)=>{if(!ok)throw Error(label);lines.push('PASS '+label);out.textContent=lines.join('\n');};
const source='dac0ba6e1f5a4d498c06cb5448a95c3f';f.src='/?project='+source;
try{
 for(let i=0;i<300&&!f.contentDocument?.querySelector('.eye-pick');i++)await wait(100);
 const w=f.contentWindow,d=f.contentDocument,$=id=>d.getElementById(id);
 const project=await (await fetch('/api/exports/'+source+'/khaula-motion.project.json')).json();
 // A registered, filled PSD-style path, deliberately outside the generated-line topology.
 for(const p of project.parts.filter(p=>['lash-r','mouth'].includes(p.role))){
  p.closedSvgText=`<svg xmlns="http://www.w3.org/2000/svg" width="${p.width}" height="${p.height}"><g transform="translate(0 0)"><path d="M 2 ${p.height*.7} Q ${p.width*.5} ${p.height*.85} ${p.width-2} ${p.height*.7} Q ${p.width*.5} ${p.height*.95} 2 ${p.height*.7} Z" fill="#382c29"/></g></svg>`;p.closedSource='psd';
 }
 const files=new w.DataTransfer();files.items.add(new w.File([JSON.stringify(project)],'donor-ui.project.json',{type:'application/json'}));$('projectInput').files=files.files;$('projectInput').dispatchEvent(new w.Event('change',{bubbles:true}));
 for(let i=0;i<300&&!d.querySelector('#eyesGuide [data-tool=contour]').hidden;i++)await wait(100);
 const visible=e=>!!e?.getClientRects().length,curve=step=>d.querySelector('#'+step+'Guide [data-tool=contour]');
 const layout=step=>{const tools=d.querySelector('#'+step+'Guide .shape-tools'),button=tools.querySelector('[data-tool=transform]');check(Math.abs(tools.getBoundingClientRect().width-button.getBoundingClientRect().width)<2,step+'：ツール一つでも横幅を使い切る');check($('tab-edit').scrollWidth<=$('tab-edit').clientWidth+1,step+'：右側に横はみ出しがない');};
 check(!$('mouthStyle'),'通常画面に旧方式の互換設定を出さない');
 d.querySelector('#eyesGuide [data-start]').click();$('eyeNumbers').open=true;await wait(200);
 check(!visible(curve('eyes'))&&!visible($('lid-thickness')),'PSDの目ではカーブと線幅を非表示');
 check(['curve','spikes'].every(k=>!visible($('lid-'+k)))&&visible($('lid-x'))&&visible($('lid-height')),'目の数値欄は移動・変形だけ残す');layout('eyes');
 $('lidSide').value='l';$('lidSide').dispatchEvent(new w.Event('change',{bubbles:true}));await wait(100);
 check(visible(curve('eyes'))&&visible($('lid-thickness')),'生成した目を選ぶとカーブと線幅が戻る');curve('eyes').click();
 $('lidSide').value='r';$('lidSide').dispatchEvent(new w.Event('change',{bubbles:true}));await wait(100);
 check(d.body.dataset.shapeTool==='transform'&&!visible(curve('eyes')),'非対応の目に切り替えたら移動・変形へ戻る');
 $('eyesCancelEdit').click();$('editMouthTab').click();
 d.querySelector('#mouthGuide [data-start]').click();$('mouthNumbers').open=true;
 for(let i=0;i<300&&!$('mouthPreparing').hidden;i++)await wait(100);
 check(!visible(curve('mouth'))&&!visible($('mouthEdit-thickness'))&&!visible($('closedInkLabel')),'塗りの口差分ではカーブ・線幅・線色を非表示');
 check(['curve','left','right','taper'].every(k=>!visible($('mouthEdit-'+k)))&&visible($('mouthEdit-x'))&&visible($('mouthEdit-height')),'口角・線端を隠し、位置・大きさは残す');
 check(!$('mouthTransition')&&visible($('mouthAdjustDonor'))&&visible($('mouthCancelEdit')),'閉じかけの調整を外し、完了・キャンセルを維持');layout('mouth');
 f.style.width='960px';await wait(150);layout('mouth');
 document.body.dataset.result='pass';
}catch(e){out.textContent+='\nFAIL '+e.stack;document.body.dataset.result='fail';}
</script>

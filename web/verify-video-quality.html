<!doctype html><meta charset="utf-8"><title>動画画質の検証</title><style>body{font:14px sans-serif}canvas{max-width:100%}pre{white-space:pre-wrap}</style><pre id="result">実行中</pre><div id="pictures"></div><script type="module">
import {prepareCanvasRenderer} from './canvas-renderer.js?v=video-quality-1';
import {svgSignature} from './raster-source.js';
import {sanitizeSvg} from './assets.js';
import {loopPose} from './motion.js?v=mouth-1';
const out=document.querySelector('#result'),log=t=>out.textContent+='\n'+t,assert=(v,t)=>{if(!v)throw Error(t);log('PASS '+t);};
async function save(blob,name){const r=await fetch('/api/exports/'+name,{method:'POST',body:blob});if(!r.ok)throw Error(await r.text());log((await r.json()).path);}
try{
 const ramp=document.createElement('canvas');ramp.width=ramp.height=64;const ctx=ramp.getContext('2d'),g=ctx.createLinearGradient(0,0,64,0);g.addColorStop(0,'#000000');g.addColorStop(1,'#ffffff');ctx.fillStyle=g;ctx.fillRect(0,0,64,64);
 const svgText='<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" fill="red"/></svg>';
 const p={width:64,height:64,parts:[{id:'p0',name:'texture',role:'static',x:0,y:0,width:64,height:64,visible:true,opacity:1,svgText,rasterSignature:await svgSignature(svgText),rasterSourceUrl:ramp.toDataURL()}],settings:{renderSource:'original'}};
 const r=await prepareCanvasRenderer(p,128,{allowUpscale:true,supersample:2});r.draw({mouth:0});const a=r.canvas.getContext('2d').getImageData(64,64,1,1).data;
 assert(r.canvas.width===128&&r.canvas.height===128,'指定解像度で出力し、2倍描画後に縮小');assert(Math.abs(a[0]-a[1])<2&&a[0]>120&&a[0]<140,'PNGの連続階調を保持');
 p.parts[0].svgText=svgText.replace('red','blue');const edited=await prepareCanvasRenderer(p,64);edited.draw({});const b=edited.canvas.getContext('2d').getImageData(32,32,1,1).data;assert(b[2]>250&&b[0]<3,'編集済みSVGを元PNGで上書きしない');
 const id=new URLSearchParams(location.search).get('project'),project=await(await fetch('/api/exports/'+id+'/khaula-motion.project.json')).json();
 project.parts.forEach((part,i)=>{part.svgText=sanitizeSvg(part.svgText,'q'+i+'-');for(const k of ['openSvgText','closedSvgText'])if(part[k])part[k]=sanitizeSvg(part[k],'q'+i+k+'-');});
 const matches=[];for(const part of project.parts)if(part.rasterSourceUrl&&part.rasterSignature===await svgSignature(part.svgText))matches.push(part.name);assert(matches.length>0,'実素材の画素とSVGの一致を確認: '+matches.join(', '));
 const s={...project.settings,background:'white'},old=await prepareCanvasRenderer({...project,settings:{...s,renderSource:'svg'}},1024),fresh=await prepareCanvasRenderer({...project,settings:{...s,renderSource:'original'}},1080,{allowUpscale:true,supersample:2});
 const pose=loopPose(.6,s);old.draw(pose);fresh.draw(pose);
 const sheet=document.createElement('canvas');sheet.width=1000;sheet.height=550;const c=sheet.getContext('2d');c.fillStyle='white';c.fillRect(0,0,1000,550);c.fillStyle='#31533b';c.font='22px sans-serif';c.fillText('従来：SVGから動画化',20,30);c.fillText('修正：元の塗り＋2倍描画',520,30);
 for(const [i,v] of [old,fresh].entries()){const scale=v.canvas.width/project.width;c.drawImage(v.canvas,260*scale,60*scale,500*scale,500*scale,i*500,50,500,500);}
 document.querySelector('#pictures').append(sheet);await save(await new Promise(r=>sheet.toBlob(r)),'video-quality-comparison.png');
 await save(await new Promise(r=>fresh.canvas.toBlob(r)),'quality-frame.png');assert(fresh.canvas.width===1080,'実素材の長辺1080px');log('ALL PASS');
}catch(e){log('FAIL '+e.stack);}
</script>

<!doctype html><meta charset="utf-8"><title>Eye texture update verification</title><pre id="result">検証中…</pre>
<script type="module">
import {prepareCanvasRenderer} from './canvas-renderer.js?v=mouth-editor-9';
const points=Array.from({length:17},(_,i)=>[i*5,25+Math.sin(i/16*Math.PI)*4]);
const path=[...points.map(([x,y])=>[x,y-2]),...points.toReversed().map(([x,y])=>[x,y+2])];
const part={id:'lash',role:'lash-r',name:'eye',x:20,y:20,width:80,height:40,visible:true,opacity:.65,svgText:'<svg width="80" height="40"><path d="M0 20 L80 25" stroke="black"/></svg>',closedSvgText:`<svg width="80" height="40"><path d="M ${path.map(p=>p.join(' ')).join(' L ')} Z" fill="#423034"/></svg>`};
const project={width:128,height:128,parts:[part],settings:{background:'transparent'}};
const lines=[],check=(ok,label)=>{if(!ok)throw Error(label);lines.push('PASS '+label);};
const pixels=r=>r.canvas.getContext('2d').getImageData(0,0,128,128).data;
try{
 for(const supersample of [1,2]){
  const r=await prepareCanvasRenderer(project,128,{supersample});
  for(const curve of [8,-4,12]){part.lidAdjust={curve,width:1.15,height:1.6,thickness:1.4,angle:13,x:4,y:-3};await r.updateClosed(part);}
  const fresh=await prepareCanvasRenderer(project,128,{supersample});
  for(const blink of [.78,1]){r.draw({blinkR:blink});fresh.draw({blinkR:blink});const a=pixels(r),b=pixels(fresh);let diff=0;for(let i=0;i<a.length;i++)diff=Math.max(diff,Math.abs(a[i]-b[i]));check(diff<=1,`incremental = export: sample ${supersample}, blink ${blink}, max difference ${diff}`);}
  fresh.dispose();const pending=r.updateClosed(part);r.dispose();await pending;check(r.canvas.width===1,'dispose during update');
 }
 document.body.dataset.result='pass';
}catch(e){lines.push('FAIL '+e.stack);document.body.dataset.result='fail';}
document.querySelector('#result').textContent=lines.join('\n');
</script>

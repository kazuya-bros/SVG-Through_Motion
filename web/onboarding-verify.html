<!doctype html><html lang="ja"><meta charset="utf-8"><title>開始画面の動作確認</title>
<style>body{font:14px system-ui}iframe{width:1100px;height:820px;border:1px solid #ddd}pre{white-space:pre-wrap}</style>
<pre id="result">確認中…</pre><iframe id="app" src="/"></iframe>
<script type="module">
const frame=document.querySelector('#app'),out=document.querySelector('#result'),lines=[],wait=ms=>new Promise(r=>setTimeout(r,ms));
const check=(ok,label)=>{if(!ok)throw Error(label);lines.push('PASS '+label);out.textContent=lines.join('\n');};
const until=async condition=>{for(let i=0;i<300;i++){if(condition())return;await wait(100);}throw Error('読み込み待ちがタイムアウト');};
try{
 await until(()=>frame.contentDocument?.querySelector('#sampleMotion canvas'));
 const d=frame.contentDocument,w=frame.contentWindow,$=id=>d.getElementById(id);
 check($('sampleOriginal').naturalWidth>0&&$('sampleLayers').children.length===4&&[...$('sampleLayers').querySelectorAll('img')].every(i=>i.naturalWidth>0),'元絵・PSDの4パーツ・動く完成例を表示');
 check($('startSourceHost').hidden&&!$('sourceContent').getClientRects().length,'最初の画面に素材登録フォームを表示しない');
 check(!$('samplePlay')&&!d.querySelector('.example-heading')&&$('sampleStatus').hidden,'サンプルの見出し・停止ボタン・説明ステータスを表示しない');
 $('startOwn').click();check($('startLanding').hidden&&!$('startSourceHost').hidden&&w.location.hash==='#materials','自分の素材で作ると素材登録画面へ切り替わる');
 check(!$('importStep1').hidden&&$('importStep2').hidden&&$('importStep3').hidden,'素材登録はSTEP 1から始まる');
 $('importNext').click();check(!$('importStep2').hidden&&!$('faceDonorOptions').getClientRects().length,'基本素材のファイル選択へ進む');
 $('sourceBack').click();await until(()=>!$('startLanding').hidden);
 check($('startSourceHost').hidden&&d.activeElement===$('startOwn'),'戻ると入口に復帰し、素材登録フォームを隠す');
 $('startOwn').click();check(!$('importStep2').hidden,'画面を往復しても選択中のSTEPを維持');
 for(const width of [1100,760,390]){frame.style.width=width+'px';await wait(100);check(d.documentElement.scrollWidth<=d.documentElement.clientWidth+1,width+'px幅で横にはみ出さない');}
 $('sourceBack').click();await until(()=>!$('startLanding').hidden);
 for(const width of [390,1100]){frame.style.width=width+'px';await wait(100);check(d.documentElement.scrollWidth<=d.documentElement.clientWidth+1,width+'px幅の入口が横にはみ出さない');}
 frame.style.width='1100px';const before=await (await fetch('/web/samples/teth/project.json')).text();
 $('startSample').click();await until(()=>$('startScreen').hidden&&$('partCount').textContent==='15');
 check($('projectName').textContent==='Teth2 · お試し'&&d.body.dataset.task==='edit','Teth2の独立コピーを編集画面で開く');
 check(!$('workspaceMode')&&!$('saveProject')&&!d.querySelector('.top-actions'),'制作画面の右上に重複する操作を置かない');
 $('editNext').click();check(d.body.dataset.task==='motion'&&$('exportTop').getClientRects().length,'動きの工程から右下の次へで進める');
 $('exportTop').click();check(d.body.dataset.task==='export'&&!$('workflowNav').hidden,'03 書き出しを制作フローに含める');
 $('projectFinish').click();await until(()=>frame.contentWindow.location.search.startsWith('?saved='));
 const id=new URLSearchParams(frame.contentWindow.location.search).get('saved');
 const saved=await(await fetch('/api/exports/'+id+'/khaula-motion.project.json')).json();
 check(saved.id.startsWith('sample-')&&saved.parts.length===15&&saved.sourceUrl.startsWith('data:'),'編集用コピーを持ち運べるJSONとして保存');
 await until(()=>frame.contentDocument.querySelector('#startUse')?.getClientRects().length);
 check(frame.contentDocument.querySelector('#editingWorkspace').hidden,'保存して完了するとメインメニューに戻る');
 check(await(await fetch('/web/samples/teth/project.json')).text()===before,'編集・保存でサンプル原本を変更しない');
 out.textContent+='\nDONE';
}catch(error){out.textContent+='\nFAIL '+error.stack+'\nApp status: '+frame.contentDocument?.querySelector('#status')?.textContent;}
</script></html>

<!doctype html><html lang="ja"><meta charset="utf-8"><title>瞳の動き・描画確認</title>
<style>body{margin:20px;background:#edf1f5;color:#203047;font:15px system-ui}h1{font-size:20px}main{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}figure{margin:0;background:white;border:1px solid #d5deeb;border-radius:10px;overflow:hidden}figcaption{padding:12px}canvas{width:100%;display:block}</style>
<h1>瞳の動き・まばたきの描画確認</h1><p id="status">確認中</p><main></main>
<script type="module">
import {prepareCanvasRenderer} from './canvas-renderer.js';
import {sceneSvg,applyPose} from './motion.js';
const fixture={width:100,height:100,settings:{rigEnabled:false,background:'transparent'},parts:[
 {id:'w',role:'white-l',x:20,y:30,width:50,height:30,visible:true,opacity:1,svgText:'<svg xmlns="http://www.w3.org/2000/svg" width="50" height="30"><rect width="50" height="30" fill="white"/></svg>'},
 {id:'i',role:'iris-l',x:30,y:32,width:28,height:26,visible:true,opacity:1,svgText:'<svg xmlns="http://www.w3.org/2000/svg" width="28" height="26"><ellipse cx="14" cy="13" rx="14" ry="13" fill="red"/></svg>'}
]};
let checks=0;
const renderer=await prepareCanvasRenderer(fixture,100);
for(const blink of [0,.7,1])for(const irisX of [-20,20])for(const irisY of [-12,12])for(const irisScale of [.8,1.2]){
 const pose={blinkL:blink,irisX,irisY,irisScale};renderer.draw(pose);
 const svg=new DOMParser().parseFromString(sceneSvg(fixture),'image/svg+xml').documentElement;applyPose(svg,pose,fixture);
 const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'})),img=new Image();img.src=url;await img.decode();
 const svgCanvas=document.createElement('canvas');svgCanvas.width=svgCanvas.height=100;svgCanvas.getContext('2d').drawImage(img,0,0);URL.revokeObjectURL(url);
 for(const canvas of [renderer.canvas,svgCanvas]){
  const pixels=canvas.getContext('2d').getImageData(0,0,100,100).data;let red=0;
  for(let y=0;y<100;y++)for(let x=0;x<100;x++){const i=(y*100+x)*4;if(pixels[i]>180&&pixels[i+1]<80&&pixels[i+3]>80){red++;if(x<20||x>=70||y<30||y>=60)throw Error('瞳が白目の外に出ています');}}
  if(blink===0&&!red)throw Error('開いた目の瞳が消えています');if(blink===1&&red)throw Error('閉じた目に瞳が残っています');checks++;
 }
}renderer.dispose();
const p=await(await fetch('./samples/teth/project.json')).json();p.settings={...p.settings,rigEnabled:false,background:'white'};
const sample=await prepareCanvasRenderer(p,1024);
for(const [irisX,irisY,irisScale,blink,label] of [[0,0,1,0,'元の瞳'],[-20,-12,1.2,0,'左上・拡大（最大値）'],[20,12,.8,0,'右下・縮小（最大値）'],[-20,-12,1.2,.7,'左上・拡大＋まばたき'],[20,12,.8,.7,'右下・縮小＋まばたき'],[20,12,1.2,1,'完全に閉じる']]){
 sample.draw({irisX,irisY,irisScale,blinkL:blink,blinkR:blink,mouth:0});
 const figure=document.createElement('figure'),caption=document.createElement('figcaption'),canvas=document.createElement('canvas');caption.textContent=label;canvas.width=510;canvas.height=315;canvas.getContext('2d').drawImage(sample.canvas,350,260,340,210,0,0,510,315);figure.append(caption,canvas);document.querySelector('main').append(figure);
}sample.dispose();document.querySelector('#status').textContent=`Canvas・SVGの描画検証：${checks}件成功（移動・拡大縮小・まばたき）`;
</script></html>

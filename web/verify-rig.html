<!doctype html><html lang="ja"><meta charset="utf-8"><title>Hybrid rig verification</title><style>body{font:14px sans-serif;background:#eee}canvas,img{width:320px;background:white}pre{white-space:pre-wrap}</style><h1>元画像＋PSD顔 / 変形の検証</h1><pre id="result">実行中</pre><div id="pictures"></div><script type="module">
import {prepareCanvasRenderer} from './canvas-renderer.js?v=voice-2';
import {sceneSvg,applyPose,loopPose,animatedSvg,channelValue} from './motion.js?v=voice-2';
import {normalizeRig,rigGroups} from './rig.js?v=voice-2';
import {restrainedDefaults} from './pachipaku-motion.js?v=voice-2';
import {sanitizeSvg} from './assets.js';
const out=document.querySelector('#result'),pictures=document.querySelector('#pictures');
const log=t=>out.textContent+='\n'+t;
const assert=(v,t)=>{if(!v)throw Error(t);log('PASS '+t);};
const parse=t=>new DOMParser().parseFromString(t,'image/svg+xml').documentElement;
async function save(blob,name){const r=await fetch('/api/exports/'+name,{method:'POST',body:blob});if(!r.ok)throw Error(await r.text());const s=await r.json();log(s.path);return s;}
try{
 const id=new URLSearchParams(location.search).get('id');
 const p=await(await fetch('/api/projects/'+id)).json();p.rig=normalizeRig(p.rig,p);
 p.parts.forEach((part,i)=>{part.svgText=sanitizeSvg(part.svgText,'qa'+i+'-');if(part.openSvgText)part.openSvgText=sanitizeSvg(part.openSvgText,'donor'+i+'-');});
 p.settings={...restrainedDefaults,...p.settings,rigEnabled:true,duration:4,sway:0,breathe:0,talking:true};
 const method=new URLSearchParams(location.search).get('method');if(['wave','spring','off'].includes(method))p.settings.hairMethod=method;
 const renderer=await prepareCanvasRenderer(p,1024);
 if(p.rig.segmented)assert(!!p.rig.seamWeights&&rigGroups(p)===null,'切り口を共有する単一メッシュを使用');
 const poses=[{name:'rest',pose:{}},{name:'blink',pose:{blinkL:1,blinkR:1}},{name:'open-turn',pose:{...loopPose(1,p.settings),mouth:1}},{name:'opposite',pose:{...loopPose(3,p.settings),mouth:.5}}];
 for(const {name,pose} of poses){renderer.draw(pose);const copy=document.createElement('canvas');copy.width=copy.height=1024;copy.getContext('2d').drawImage(renderer.canvas,0,0);pictures.append(copy);await save(await new Promise(r=>copy.toBlob(r)),'hybrid-'+name+'.png');}
 const before=performance.now();for(let i=0;i<30;i++)renderer.draw(loopPose(i/30,p.settings));log('30フレーム描画 '+Math.round(performance.now()-before)+' ms');
 const svg=parse(sceneSvg(p));applyPose(svg,poses[2].pose,p);
 const img=new Image(),url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'}));img.src=url;await img.decode();pictures.append(img);
 const c=document.createElement('canvas');c.width=c.height=1024;c.getContext('2d').drawImage(img,0,0);renderer.draw(poses[2].pose);
 const a=c.getContext('2d').getImageData(0,0,1024,1024).data,b=renderer.canvas.getContext('2d').getImageData(0,0,1024,1024).data;
 let diff=0;for(let i=0;i<a.length;i++)diff+=Math.abs(a[i]-b[i]);diff/=a.length;
 assert(diff<4,'SVGと動画の同じポーズが一致: mean '+diff.toFixed(3));
 const animated=animatedSvg(p,p.settings,parse),root=parse(animated),ids=[...root.querySelectorAll('[id]')].map(n=>n.id);
 assert(ids.length===new Set(ids).size,'SVG内のIDに重複なし');
 assert([...root.querySelectorAll('animate,animateTransform')].every(a=>{const v=a.getAttribute('values').split(';');return v[0]===v.at(-1);}), 'ループSVGの始点と終点が一致');
 assert(root.querySelectorAll('animateTransform[type="skewX"]').length>=432,'髪・首・輪郭の変形をSVGに格納');
 root.style.width='320px';root.style.height='320px';pictures.append(root);root.pauseAnimations();
 await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));root.setCurrentTime(1);
 const meshNode=root.querySelector('[data-channel$="mesh-0-translate"]'),matrix=meshNode.transform.animVal.getItem(0).matrix;
 const expected=channelValue(meshNode.dataset.channel,loopPose(1,p.settings),p).value.split(' ').map(Number);
 assert(Math.abs(matrix.e-expected[0])<.01&&Math.abs(matrix.f-expected[1])<.01,'実ブラウザのSMIL変形が指定時刻のポーズに一致');
 root.setCurrentTime(.125);assert(root.querySelector('[data-channel$="mouth-open"]').transform.animVal.getItem(0).matrix.d>.6,'SVG単体でも開口差分が動く');
 await save(new Blob([animated],{type:'image/svg+xml'}),'hybrid-loop.svg');
 log('ALL PASS');
}catch(e){log('FAIL '+e.stack);}
</script></html>

<!doctype html><meta charset="utf-8"><title>TTS UI verification</title><button id="run">音声設定を検証</button><pre id="result">準備中</pre><iframe id="app" src="/?project=2c4f269e67f64ece858cf66d328ae666" style="width:1100px;height:750px"></iframe>
<script type="module">
const frame=document.querySelector('#app'),out=document.querySelector('#result'),wait=ms=>new Promise(r=>setTimeout(r,ms));let log=[];
const check=(ok,name)=>{if(!ok)throw Error(name);log.push('PASS '+name);out.textContent=log.join('\n');};
document.querySelector('#run').onclick=async()=>{log=[];
try{
 for(let i=0;i<300&&!frame.contentDocument.querySelector('canvas.rig-preview');i++)await wait(100);
 const w=frame.contentWindow,d=frame.contentDocument,$=id=>d.getElementById(id),originalFetch=w.fetch.bind(w);let saved;
 w.fetch=async(url,options={})=>{if(String(url)==='/api/tts/voices'){const b=JSON.parse(options.body);let voices=b.engine==='irodori'?[{label:'sample',model:'irodori-tts',voice:'sample'}]:[{label:'テスト音声',speaker_id:123456789}];return new w.Response(JSON.stringify({engine:b.engine,voices}),{headers:{'content-type':'application/json'}});}if(String(url).startsWith('/api/exports/')&&options.method==='POST'){saved=JSON.parse(await options.body.text());return new w.Response(JSON.stringify({url:'/test-only.json',path:'test-only',bytes:0}),{headers:{'content-type':'application/json'}});}return originalFetch(url,options);};
 const choose=value=>{$('engine').value=value;$('engine').dispatchEvent(new w.Event('change'));};
 d.querySelector('#workflowNav [data-tab=motion]').click();d.querySelector('#motionVoice').click();
 check($('engine').options.length===5,'5種類の音声エンジンを選択可能');
 choose('voicevox');check($('ttsUrl').value.endsWith(':50021')&&$('ttsWeightLabel').hidden,'VOICEVOXには対応するURLと声の選択だけ表示');
 await $('connectTts').onclick();check($('ttsVoice').selectedOptions[0].textContent==='テスト音声','名前で声を選べる');
 choose('aivis');check($('ttsUrl').value.endsWith(':10101'),'AivisSpeechの接続先は独立');
 await $('connectTts').onclick();choose('voicevox');check($('ttsVoice').selectedOptions[0].textContent==='テスト音声','エンジン切替後も選択した声を保持');
 choose('irodori');check(!$('ttsKeyLabel').hidden&&$('ttsUrl').value.endsWith(':8088'),'IrodoriはOpenAI互換URLと任意の認証欄');
 $('ttsApiKey').value='fixture-secret';await $('connectTts').onclick();$('saveProject').click();for(let i=0;i<300&&!saved;i++)await wait(100);
 check(saved?.voiceSettings.ttsConfig.selected==='irodori'&&saved.voiceSettings.ttsConfig.engines.irodori.voice==='sample','プロジェクト保存に選択したエンジン・声を含む');
 check(!JSON.stringify(saved.voiceSettings).includes('fixture-secret')&&!('api_key' in saved.voiceSettings.ttsConfig.engines.irodori),'認証キーはプロジェクトに保存しない');
 const mod=await w.eval("import('/web/app.js?v=workspace-2')");mod.adoptProject(saved);
 check($('engine').value==='irodori'&&$('ttsVoice').selectedOptions[0].textContent==='sample'&&!$('ttsApiKey').value,'再読込で声を復元し認証欄は空にする');
 choose('browser');check($('ttsAdvanced').hidden&&$('connectTts').hidden&&$('ttsHint').textContent.includes('WAV保存'),'ブラウザ標準は接続設定なし・録音の制限を明示');
 w.fetch=originalFetch;document.body.dataset.result='pass';
}catch(e){log.push('FAIL '+e.stack);out.textContent=log.join('\n');document.body.dataset.result='fail';}
};
out.textContent='「音声設定を検証」を押してください（通信は模擬応答、保存ファイルは作りません）。';
</script>

<!doctype html><meta charset="utf-8"><title>White gap alpha verification</title><pre id="result">検証中…</pre>
<script type="module">
const out=document.querySelector('#result'),lines=[];
const read=async url=>{const im=new Image();im.src=url;await im.decode();const c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);return c.getContext('2d').getImageData(0,0,c.width,c.height).data;};
try{
 const p=await (await fetch('/api/exports/ac5d7c9ff1f649339cf67e36058c2f05/khaula-motion.project.json')).json();
 const old=await (await fetch('/api/exports/b989817d4b1b4fb59829d32f3b15003a/khaula-motion.project.json')).json();
 for(const spec of p.conversion.hairGapRepair){
  const part=p.parts.find(v=>v.id===spec.id),before=old.parts.find(v=>v.id===spec.id);
  const original=await read(before.rasterSourceUrl),raster=await read(part.rasterSourceUrl);
  const url=URL.createObjectURL(new Blob([part.svgText],{type:'image/svg+xml'}));let svg;try{svg=await read(url);}finally{URL.revokeObjectURL(url);}
  let removed=0,opaque=0;
  for(let i=3;i<raster.length;i+=4)if(original[i]>0&&raster[i]===0){removed++;if(svg[i]>2)opaque++;}
  if(removed!==spec.pixels||opaque)throw Error(part.id+': SVG opacity mismatch '+opaque);
  lines.push('PASS '+part.id+': '+removed+' corrected pixels transparent in PNG and SVG');
 }
 document.body.dataset.result='pass';
}catch(e){document.body.dataset.result='fail';lines.push('FAIL '+e.stack);}
out.textContent=lines.join('\n');
</script>

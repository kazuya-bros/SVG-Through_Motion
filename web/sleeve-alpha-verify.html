<!doctype html><meta charset="utf-8"><title>袖の透過修復</title><style>body{font:15px system-ui}section{display:flex}figure{margin:12px}canvas{width:440px;height:440px;background:repeating-conic-gradient(#202838 0% 25%,#273143 0% 50%) 0/20px 20px}pre{white-space:pre-wrap}</style>
<button id="run">修復を検証して別ファイルに保存</button><pre id="result">待機中</pre><section id="images"></section><a id="open" hidden>修復済みプロジェクトを開く</a>
<script type="module">
import {sanitizeSvg} from './assets.js';
import {svgSignature} from './raster-source.js';
import {prepareCanvasRenderer} from './canvas-renderer.js';
const out=document.querySelector('#result');
document.querySelector('#run').onclick=async()=>{
 try{
  const get=async id=>(await fetch(`/api/exports/${id}/khaula-motion.project.json`)).json();
  const before=await get('b67fb7b9f9994fd197c63f7a213c934c'),after=await get('a1e040081c734a2d92c65f5e413d2cfe');
  for(const part of after.parts)if(after.sleeveAlphaRepairParts.includes(part.id)){part.svgText=sanitizeSvg(part.svgText,'fixed-');part.rasterSignature=await svgSignature(part.svgText);}
  const log=[],check=(ok,text)=>{if(!ok)throw Error(text);log.push('PASS '+text);out.textContent=log.join('\n');};
  check(JSON.stringify(before.settings)===JSON.stringify(after.settings)&&JSON.stringify(before.voiceSettings)===JSON.stringify(after.voiceSettings),'動き・音声設定を保持');
  check(before.parts.every((p,i)=>p.id==='p003'||JSON.stringify(p)===JSON.stringify(after.parts[i])),'袖以外のパーツ・閉じ目・閉じ口の編集を保持');
  const pose={sway:0,breathe:0,blinkL:0,blinkR:0,mouth:0};
  for(const [name,p,mode] of [['修復前',before,'original'],['修復後',after,'original'],['修復後 SVG',after,'svg']]){
    const copy=structuredClone(p);copy.settings={...copy.settings,background:'transparent',renderSource:mode,rigEnabled:false};
    const renderer=await prepareCanvasRenderer(copy,1024);renderer.draw(pose);
    const figure=document.createElement('figure'),caption=document.createElement('figcaption');caption.textContent=name;figure.append(caption,renderer.canvas);document.querySelector('#images').append(figure);
    const ctx=renderer.canvas.getContext('2d'),alpha=ctx.getImageData(740,850,1,1).data[3];
    check(name==='修復前'?alpha===0:alpha>245,`${name} 袖の透明度=${alpha}`);
  }
  const response=await fetch('/api/exports/khaula-motion.project.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(after)});
  if(!response.ok)throw Error('修復データの保存に失敗');const saved=await response.json();
  const id=saved.url.split('/')[3],link=document.querySelector('#open');link.href='/?project='+id;link.hidden=false;
  document.body.dataset.result='pass';out.textContent+='\n保存先 '+saved.path;
 }catch(error){out.textContent+='\nFAIL '+error.message;document.body.dataset.result='failed';}
};
</script>

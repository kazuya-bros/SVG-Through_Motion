<!doctype html><meta charset="utf-8"><title>顔解析の起動検証</title>
<button id="start">モデルを検証（カメラは使用しません）</button><button id="stop">キャンセル</button><p id="ticks"></p><pre id="result">待機中</pre>
<script type="module">
import {FaceTracker} from './face-tracker.js';
let tracker,count=0,generation=0;
const out=document.querySelector('#result');setInterval(()=>document.querySelector('#ticks').textContent=`画面応答 ${++count}`,100);
document.querySelector('#start').onclick=async()=>{
  const current=++generation;tracker?.close();document.body.dataset.result='running';
  tracker=new FaceTracker({onProgress:text=>out.textContent=text});
  try{await tracker.init();if(current!==generation)return;
    const canvas=document.createElement('canvas');canvas.width=320;canvas.height=240;
    const result=await tracker.detect(canvas,performance.now());
    out.textContent='PASS 実モデル起動・Worker内の画像解析完了（空画像、カメラ未使用）';document.body.dataset.result='pass';tracker.close();
  }catch(error){if(current!==generation)return;out.textContent=error.message;document.body.dataset.result='failed';}
};
document.querySelector('#stop').onclick=()=>{generation++;tracker?.close();out.textContent='キャンセル済み・再試行できます';document.body.dataset.result='cancelled';};
</script>

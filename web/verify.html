<!doctype html><html lang="ja"><meta charset="utf-8"><title>Khaula Motion — Browser verification</title><style>body{font:14px system-ui;margin:30px;background:#f7f8f4;color:#263c2b}li{padding:7px}.pass{color:#2b6a3c}.fail{color:#a53423}canvas{width:250px;background:repeating-conic-gradient(#eee 0% 25%,white 0% 50%) 50% / 10px 10px;border:1px solid #ddd}button{padding:12px;margin:15px}#live svg{width:200px;height:200px}</style><h1>Browser verification</h1><p>実ブラウザのSVG描画・マスク・アニメーションと入力検証</p><ol id="results"></ol><strong id="summary">Running…</strong><div id="live"></div><div id="renders"></div><button id="model">MediaPipe初期化を検証（カメラなし）</button><div id="modelResult"></div><script type="module">
import {sanitizeSvg,zipFiles} from './assets.js';
import {prepareCanvasRenderer} from './canvas-renderer.js';
import {withSampleMouth} from './sample-mouth.js';
import {sceneSvg,animatedSvg,applyPose,loopPose} from './motion.js';
const results=[];const parse=t=>new DOMParser().parseFromString(t,'image/svg+xml').documentElement;
const assert=(v,m)=>{if(!v)throw Error(m);};
const test=async(name,fn)=>{let ok=true,detail='';try{await fn();}catch(e){ok=false;detail=e.message;}results.push({name,ok,detail});const li=document.createElement('li');li.className=ok?'pass':'fail';li.textContent=(ok?'PASS ':'FAIL ')+name+' '+detail;document.querySelector('#results').append(li);};
const svgText='<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><defs><mask id="a" x="0" y="0" width="40" height="40" maskUnits="userSpaceOnUse" mask-type="luminance" color-interpolation="sRGB"><rect width="40" height="40" fill="#929292"/></mask></defs><rect width="40" height="40" fill="red" mask="url(#a)"/></svg>';
await test('scripts and external SVG resources are rejected',()=>{for(const t of ['<script/>','<image href="https://example.com/p.png"/>','<use href="https://example.com/evil.svg#a"/>']){let rejected=false;try{sanitizeSvg(`<svg xmlns="http://www.w3.org/2000/svg">${t}</svg>`,'test-');}catch{rejected=true;}assert(rejected,t);}});
await test('event handlers removed; IDs and mask references rewritten together',()=>{const clean=sanitizeSvg(svgText.replace('fill="red"','fill="red" onclick="alert(1)"'),'safe-');assert(!clean.includes('onclick'),'event survived');assert(clean.includes('id="safe-a"')&&clean.includes('url(#safe-a)'),'broken IDs');});
async function render(text,size=100){const canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;const image=new Image();const url=URL.createObjectURL(new Blob([text],{type:'image/svg+xml'}));image.src=url;try{await image.decode();canvas.getContext('2d').drawImage(image,0,0,size,size);}finally{URL.revokeObjectURL(url);}return canvas;}
await test('SVG luminance mask preserves ~57% alpha, without alpha squaring',async()=>{const canvas=await render(sanitizeSvg(svgText,'alpha-'),40);const pixel=canvas.getContext('2d').getImageData(20,20,1,1).data;assert(pixel[3]>=140&&pixel[3]<=150,'alpha='+pixel[3]);assert(pixel[0]>240,'red channel lost');});
const settings={duration:4,sway:1.2,breathe:3,blink:true,talking:true};
const eye='<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><circle cx="10" cy="10" r="9" fill="white"/></svg>';
const iris='<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30"><rect width="30" height="30" fill="red"/></svg>';
const p={version:1,width:100,height:100,name:'Fixture',settings,parts:[{id:'p0',name:'white',role:'white-r',x:20,y:20,width:20,height:20,visible:true,opacity:1,svgText:eye},{id:'p1',name:'iris',role:'iris-r',x:15,y:15,width:30,height:30,visible:true,opacity:1,svgText:iris}]};
await test('iris clips to the white shape in canvas coordinates',async()=>{const c=await render(sceneSvg(p,settings));const ctx=c.getContext('2d');assert(ctx.getImageData(16,16,1,1).data[3]===0,'iris leaked outside white');assert(ctx.getImageData(30,30,1,1).data[0]>240,'iris center missing');});
await test('SMIL export really blinks in the browser and has no external assets',async()=>{const text=animatedSvg(p,settings,parse),root=parse(text);document.querySelector('#live').append(root);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));root.pauseAnimations();root.setCurrentTime(2.88);await new Promise(r=>requestAnimationFrame(r));const m=root.querySelector('[data-channel="eye-r"]').transform.animVal.getItem(0).matrix;assert(m.d<.04,'eye did not close: '+m.d);root.setCurrentTime(4);await new Promise(r=>requestAnimationFrame(r));assert(root.querySelector('[data-channel="eye-r"]').transform.animVal.getItem(0).matrix.d>.99,'loop did not reopen');assert(!root.querySelector('image,script'),'raster/script dependency');});
await test('real PSD project renders neutral, blink, and open-mouth poses',async()=>{const list=await(await fetch('/api/projects')).json();assert(list.length,'convert sample first');const project=withSampleMouth(await(await fetch('/api/projects/'+list[0].id)).json());project.settings={...project.settings,...settings};for(const [i,part] of project.parts.entries())part.svgText=sanitizeSvg(part.svgText,'real-'+i+'-');for(const [name,overrides] of [['neutral',{}],['blink',{blinkL:1,blinkR:1}],['mouth',{mouth:.85}]]){const root=parse(sceneSvg(project,project.settings));applyPose(root,{...loopPose(0,project.settings),...overrides},project);const c=await render(new XMLSerializer().serializeToString(root),512);c.title=name;document.querySelector('#renders').append(c);const data=c.getContext('2d').getImageData(0,0,512,512).data;assert(data.some((v,i)=>i%4===3&&v>200),'empty render');}});
await test('cached video renderer agrees with SVG neutral and closed-eye frames',async()=>{const list=await(await fetch('/api/projects')).json();const project=withSampleMouth(await(await fetch('/api/projects/'+list[0].id)).json());project.settings={...project.settings,...settings};for(const [i,part] of project.parts.entries())part.svgText=sanitizeSvg(part.svgText,'cache-'+i+'-');const renderer=await prepareCanvasRenderer(project,512);for(const overrides of [{},{blinkL:1,blinkR:1,mouth:.8}]){const pose={...loopPose(0,project.settings),...overrides};renderer.draw(pose);const root=parse(sceneSvg(project,project.settings));applyPose(root,pose,project);const reference=await render(new XMLSerializer().serializeToString(root),512);const a=reference.getContext('2d').getImageData(0,0,512,512).data,b=renderer.canvas.getContext('2d').getImageData(0,0,512,512).data;let error=0;for(let i=0;i<a.length;i++)error+=Math.abs(a[i]-b[i]);assert(error/a.length<6,'mean pixel difference '+error/a.length);}});
await test('fully closed eye hides all white and iris pixels',async()=>{
  const root=parse(sceneSvg(p));applyPose(root,{blinkL:1,blinkR:1},p);
  const c=await render(new XMLSerializer().serializeToString(root));
  assert(!c.getContext('2d').getImageData(0,0,100,100).data.some((v,i)=>i%4===3&&v),'eye pixels remain');
});
await test('native mouth and secondary motion agree in SVG and video at multiple poses',async()=>{
  const s={duration:3,sway:1.2,breathe:0,blink:true,talking:true,singleBounce:true,bounceHeight:8,hair:5,chest:8,ears:5,closedWidth:.8,background:'white'};
  const q={name:'Motion fixture',width:100,height:100,settings:s,parts:[]};
  for(const [i,role] of ['hair','chest','ear-r','ear-l','mouth'].entries())q.parts.push({id:'t'+i,role,x:10+i*16,y:role==='mouth'?65:20,width:12,height:20,visible:true,opacity:.8,mouthMode:'source-open',svgText:`<svg xmlns="http://www.w3.org/2000/svg" width="12" height="20"><rect x="1" y="1" width="10" height="18" fill="${['cyan','green','red','purple','blue'][i]}"/></svg>`});
  const renderer=await prepareCanvasRenderer(q,100);
  for(const t of [0,.6,.84,1.2,2.16]){
    const pose=loopPose(t,s);renderer.draw(pose);const root=parse(sceneSvg(q));applyPose(root,pose,q);
    const reference=await render(new XMLSerializer().serializeToString(root));
    const a=reference.getContext('2d').getImageData(0,0,100,100).data,b=renderer.canvas.getContext('2d').getImageData(0,0,100,100).data;
    let error=0;for(let i=0;i<a.length;i++)error+=Math.abs(a[i]-b[i]);assert(error/a.length<3,'pose '+t+' difference '+error/a.length);
  }
  const text=animatedSvg(q,s,parse),root=parse(text);document.querySelector('#live').append(root);root.pauseAnimations();root.setCurrentTime(0);await new Promise(r=>requestAnimationFrame(r));
  assert(Math.abs(root.querySelector('[data-channel="mouth-native"]').transform.animVal.getItem(0).matrix.a-.8)<.001,'SMIL closed mouth width');
  assert(!root.querySelector('text'),'visible text in export');
});
document.querySelector('#summary').textContent=`${results.filter(x=>x.ok).length}/${results.length} passed`;
document.querySelector('#model').onclick=async()=>{const o=document.querySelector('#modelResult');o.textContent='Loading model…';try{const {FilesetResolver,FaceLandmarker}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs');const fs=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm');const model=await FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'CPU'},runningMode:'IMAGE',outputFaceBlendshapes:true,numFaces:1});const blank=document.createElement('canvas');blank.width=256;blank.height=256;const result=model.detect(blank);assert(Array.isArray(result.faceBlendshapes),'result schema');model.close();o.textContent='PASS: MediaPipe initialization + real model inference, no camera used';}catch(e){o.textContent='FAIL: '+e.message;}};
</script></html>

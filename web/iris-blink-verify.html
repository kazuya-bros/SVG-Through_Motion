<!doctype html><meta charset="utf-8"><title>Iris occlusion verification</title><pre id="result">検証中…</pre>
<script type="module">
import {prepareCanvasRenderer} from './canvas-renderer.js';
import {sceneSvg,applyPose,animatedSvg} from './motion.js';
const lines=[],check=(ok,label)=>{if(!ok)throw Error(label);lines.push('PASS '+label);};
const svg=body=>`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="42">${body}</svg>`;
const parts=['r','l'].flatMap((side,i)=>[
 {id:'w'+side,role:'white-'+side,x:12+i*100,y:15,width:64,height:42,visible:true,opacity:1,svgText:svg('<path d="M0 12 L64 0 L64 30 L0 42Z" fill="white"/>')},
 {id:'i'+side,role:'iris-'+side,x:12+i*100,y:15,width:64,height:42,visible:true,opacity:1,svgText:svg('<circle cx="32" cy="24" r="18" fill="#bb6611"/><rect x="28" y="21" width="4" height="4" fill="#ff00ff"/><rect x="30" y="28" width="4" height="3" fill="#00ffff"/>')}
]);
const project={width:200,height:80,name:'tilted eyes',parts,settings:{background:'transparent',duration:4,blink:true}};
const pixels=c=>c.getContext('2d').getImageData(0,0,200,80).data;
function marker(a,side,color){let x=0,y=0,n=0;for(let yy=0;yy<80;yy++)for(let xx=side*100;xx<(side+1)*100;xx++){const k=(yy*200+xx)*4;if(a[k+3]>200&&color.every((v,c)=>Math.abs(a[k+c]-v)<8)){x+=xx;y+=yy;n++;}}return {x:x/n,y:y/n,n};}
async function vector(p,pose){const doc=new DOMParser().parseFromString(sceneSvg(p,p.settings,false),'image/svg+xml');applyPose(doc.documentElement,pose,p);const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(doc)],{type:'image/svg+xml'})),im=new Image();im.src=url;try{await im.decode();const c=document.createElement('canvas');c.width=200;c.height=80;c.getContext('2d').drawImage(im,0,0);return pixels(c);}finally{URL.revokeObjectURL(url);}}
try{
 for(const missingWhite of [false,true]){
  const p=structuredClone(project);if(missingWhite)p.parts=p.parts.filter(v=>!v.role.startsWith('white-'));
  for(const sample of [1,2]){
   const renderer=await prepareCanvasRenderer(p,200,{supersample:sample});
   const draw=pose=>{renderer.draw(pose);return pixels(renderer.canvas);};
   const base=draw({blinkL:0,blinkR:0});
   for(const pose of [{blinkL:0,blinkR:.5},{blinkL:.5,blinkR:0},{blinkL:.5,blinkR:.5}]){
    const canvas=draw(pose),exported=await vector(p,pose);
    for(let side=0;side<2;side++)for(const color of [[255,0,255],[0,255,255]]){
     const a=marker(base,side,color);check(a.n>0,'reference marker present');
     for(const [name,data] of [['canvas',canvas],['svg',exported]]){const b=marker(data,side,color);check(b.n>0&&Math.abs(a.x-b.x)<.3&&Math.abs(a.y-b.y)<.3,`${name} pupil/highlight stays fixed: side ${side}, sample ${sample}, fallback ${missingWhite}`);}
    }
   }
   for(const data of [draw({blinkL:1,blinkR:1}),await vector(p,{blinkL:1,blinkR:1})])check(!data.some((v,i)=>i%4===3&&v>0),'full blink hides eye content');
   renderer.dispose();
  }
 }
 const animated=animatedSvg(project,project.settings,s=>new DOMParser().parseFromString(s,'image/svg+xml').documentElement);
 const doc=new DOMParser().parseFromString(animated,'image/svg+xml');
 check(doc.querySelector('#eye-clip-r animateTransform')!==null,'export animates the aperture');
 check(doc.querySelector('[data-part="ir"] [data-channel="eye-r"]')===null,'export does not scale iris artwork');
 document.body.dataset.result='pass';
}catch(e){lines.push('FAIL '+e.stack);document.body.dataset.result='fail';}
document.querySelector('#result').textContent=lines.join('\n');
</script>

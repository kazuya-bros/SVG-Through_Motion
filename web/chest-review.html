<!doctype html><html lang="ja"><meta charset="utf-8"><title>胸揺れの描画検証</title><style>body{font:16px system-ui;background:#eef1f5}main{display:flex;gap:12px}canvas{width:360px;background:white}pre{white-space:pre-wrap}</style><h1>胸揺れの描画検証</h1><pre id="status">確認中</pre><main></main><script type="module">
import {chestFilter,chestRegion} from './chest-motion.js';
import {prepareCanvasRenderer} from './canvas-renderer.js';
import {loopPose} from './motion.js';
const project=await(await fetch('./samples/teth/project.json')).json();project.settings={...project.settings,independentHair:true,rigEnabled:true,chest:40,headTilt:0,headNod:0,headYaw:0,headPitch:0,sway:0,breathe:0,frontHair:0,backHair:0,armSwing:0,talking:false,blink:false,duration:4};
const renderer=await prepareCanvasRenderer(project,512),snapshots=[];
for(const t of [1,3]){renderer.draw(loopPose(t,project.settings));const c=document.createElement('canvas');c.width=c.height=512;c.getContext('2d').drawImage(renderer.canvas,0,0);document.querySelector('main').append(c);snapshots.push(c.getContext('2d').getImageData(0,0,512,512).data);}
let chestDiff=0,faceDiff=0;for(let y=0;y<512;y++)for(let x=0;x<512;x++){const i=(y*512+x)*4,d=Math.abs(snapshots[0][i]-snapshots[1][i])+Math.abs(snapshots[0][i+1]-snapshots[1][i+1])+Math.abs(snapshots[0][i+2]-snapshots[1][i+2]);if(d>10){if(y<245)faceDiff++;else chestDiff++;}}
const r=chestRegion(project),svgImages=[];
for(const scale of [0,-48]){const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"><defs>${chestFilter(project,'chest').replace('scale="0"',`scale="${scale}"`)}</defs><g filter="url(#chest)"><rect width="1024" height="1024" fill="white"/><circle cx="${r.cx}" cy="${r.cy}" r="12" fill="red"/></g></svg>`,url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})),img=new Image();img.src=url;await img.decode();const c=document.createElement('canvas');c.width=c.height=1024;c.getContext('2d').drawImage(img,0,0);URL.revokeObjectURL(url);const pixels=c.getContext('2d').getImageData(0,0,1024,1024).data;let sum=0,n=0;for(let y=0;y<1024;y++)for(let x=0;x<1024;x++){const i=(y*1024+x)*4;if(pixels[i]>180&&pixels[i+1]<80&&pixels[i+3]>200){sum+=y;n++;}}svgImages.push(n?sum/n:null);}
const shift=svgImages[1]-svgImages[0],ok=chestDiff>100&&faceDiff===0&&svgImages.every(v=>v!==null)&&shift>15;
document.querySelector('#status').textContent=JSON.stringify({ok,chestChangedPixels:chestDiff,faceChangedPixels:faceDiff,svgShiftPixels:shift},null,2);renderer.dispose();if(!ok)throw Error('胸揺れの描画検証に失敗しました');
</script></html>

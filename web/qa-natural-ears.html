<!doctype html><meta charset="utf-8"><title>自然な耳の動きの検証</title>
<style>body{font:14px sans-serif;background:#eee}main{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}figure{margin:0;background:white}canvas{width:100%}pre{white-space:pre-wrap}</style>
<h1>自然なピコピコ：実サンプル</h1><pre id="result">準備中</pre><main></main>
<script type="module">
import {naturalEarPose} from './natural-ears.js';
import {prepareCanvasRenderer} from './canvas-renderer.js';
import {animatedSvg,applyPose,loopPose} from './motion.js';
import {sanitizeSvg} from './assets.js';
const log=t=>document.querySelector('#result').textContent+='\n'+t;
const parse=s=>new DOMParser().parseFromString(s,'image/svg+xml').documentElement;
const show=(source,label)=>{const f=document.createElement('figure'),c=document.createElement('canvas');c.width=500;c.height=300;c.getContext('2d').drawImage(source,240,0,500,300,0,0,500,300);f.append(label,c);document.querySelector('main').append(f);};
try{
 const p=await(await fetch('./samples/teth/project.json')).json();
 p.settings={...p.settings,rigEnabled:false,duration:4,earPattern:'natural',earCycles:1,ears:30,background:'white'};
 for(const [i,a] of p.parts.entries()){a.earMotion=a.id==='p004';a.svgText=sanitizeSvg(a.svgText,`earqa${i}-`);}
 const renderer=await prepareCanvasRenderer(p,1024),samples=Array.from({length:120},(_,i)=>naturalEarPose(i/120,p.settings)).sort((a,b)=>a.earNaturalL-b.earNaturalL),poses=[{},samples[0],samples.at(-1)];
 for(const [i,pose]of poses.entries()){renderer.draw(pose);show(renderer.canvas,'Canvas '+i);}
 const start=performance.now();for(let i=0;i<120;i++)renderer.draw(loopPose(i/30,p.settings));log('Canvas '+((performance.now()-start)/120).toFixed(1)+' ms/frame（120コマ）');
 const root=parse(animatedSvg(p,p.settings,parse));root.querySelectorAll('animate,animateTransform').forEach(a=>a.remove());
 const hashes=[];let torso=null;
 for(const [i,pose]of poses.entries()){
  applyPose(root,pose,p);const im=new Image();im.src=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(root)],{type:'image/svg+xml'}));await im.decode();
  const c=document.createElement('canvas');c.width=c.height=1024;const ctx=c.getContext('2d');ctx.drawImage(im,0,0);show(c,'SVG '+i);
  let hash=0;for(const n of ctx.getImageData(240,0,500,300).data)hash=(hash*31+n)>>>0;hashes.push(hash);
  const body=ctx.getImageData(280,500,450,400).data;if(torso&&torso.some((n,j)=>n!==body[j]))throw Error('耳の動きで身体が変化');torso=body;
  URL.revokeObjectURL(im.src);
 }
 if(new Set(hashes).size!==3)throw Error('SVGの耳が変化していない');
 log('PASS Canvas / SVG 実サンプル描画、SVGの3ポーズが変化、身体は不変');
 log('PASS SVGの耳の絵は '+root.querySelectorAll('[data-part="p004"]').length+' 回だけ描画');renderer.dispose();
}catch(e){log('FAIL '+e.stack);}
</script>

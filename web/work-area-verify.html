<!doctype html><html lang="ja"><meta charset="utf-8"><title>Shape workspace verification</title>
<style>body{font:14px system-ui;margin:20px}pre{white-space:pre-wrap}iframe{width:1100px;height:750px;border:1px solid #ddd}</style>
<h1>静止編集・ホイール操作の検証</h1><pre id="result">検証中…</pre>
<iframe id="app" src="/?project=2c4f269e67f64ece858cf66d328ae666"></iframe>
<script type="module">
const log=[],output=document.querySelector('#result'),frame=document.querySelector('#app');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const check=(ok,name)=>{if(!ok)throw Error(name);log.push('PASS '+name);output.textContent=log.join('\n');};
try{
 for(let i=0;i<300&&!frame.contentDocument?.querySelector('canvas.rig-preview');i++)await wait(100);
 const w=frame.contentWindow,d=frame.contentDocument,$=id=>d.getElementById(id),stage=$('stage');
 check(d.body.dataset.editStep==='eyes','目から開始');await wait(400);
 check(+$('editEyeClosure').value===0&&+$('mouth').value===1&&!$('eyeDirectSvg')?.querySelector('.transform-handle'),'開き目・開き口で開始し閉じ形ハンドルを出さない');
 d.querySelector('#eyesGuide [data-start]').click();await wait(100);
 check(+$('editEyeClosure').value===.78&&!$('eyeNumbers').open,'補正対象から閉じ目の重ね表示');
 check($('eyeDirectSvg').querySelectorAll('.transform-handle').length===8,'作業エリアに閉じ目の編集ハンドル');
 const count=stage.dataset.drawCount,time=$('timeValue').textContent;await wait(350);
 check(stage.dataset.drawCount===count&&$('timeValue').textContent===time,'無操作では時刻・再描画を停止');
 const r=stage.getBoundingClientRect(),x=Math.round(r.x+r.width*.6),y=Math.round(r.y+r.height*.4);
 const before=new w.DOMMatrix($('artboard').style.transform);
 stage.dispatchEvent(new w.WheelEvent('wheel',{clientX:x,clientY:y,deltaY:-120,bubbles:true,cancelable:true}));await wait(40);
 const after=new w.DOMMatrix($('artboard').style.transform);
 check(after.a>before.a,'目の作業エリアでホイール拡大');
 const cx=x-r.x-r.width/2,cy=y-r.y-r.height/2;
 check(Math.abs((cx-before.e)/before.a-(cx-after.e)/after.a)<.01&&Math.abs((cy-before.f)/before.a-(cy-after.f)/after.a)<.01,'カーソル下の位置を保つ');
 $('editEyeClosure').value='.4';$('editEyeClosure').dispatchEvent(new w.Event('input',{bubbles:true}));await wait(70);
 check(+$('eyeClosureOut').value.replace('%','')===40&&stage.dataset.drawCount!==count,'目は手動の開閉だけ更新');
 $('editNext').click();for(let i=0;i<200&&!$('mouthPreparing').hidden;i++)await wait(100);
 check(d.body.dataset.editStep==='mouth'&&!$('mouthWorkbench').hidden,'次へで口の直接編集');
 check(+$('mouth').value===1&&$('mouthDirectHandles').style.display==='none','口は開き口の案内から開始');
 d.querySelector('#mouthGuide [data-start]').click();await wait(120);
 check(+$('mouth').value===.06&&$('mouthDirectHandles').querySelectorAll('.transform-handle').length===8,'補正対象を選ぶと重ね表示と8ハンドルを表示');
 d.querySelector('#mouthGuide [data-pose=blend]').click();await wait(100);
 check(+$('mouth').value===.06&&$('mouthDirectHandles').style.display!=='none','重ね表示は任意に選択できる');
 const mouth=$('mouthDirectSvg'),mr=mouth.getBoundingClientRect(),mx=Math.round(mr.x+mr.width*.6),my=Math.round(mr.y+mr.height*.6);
 const a=new w.DOMPoint(mx,my).matrixTransform(mouth.getScreenCTM().inverse()),width=mouth.viewBox.baseVal.width;
 mouth.dispatchEvent(new w.WheelEvent('wheel',{clientX:mx,clientY:my,deltaY:-120,bubbles:true,cancelable:true}));await wait(50);
 const b=new w.DOMPoint(mx,my).matrixTransform(mouth.getScreenCTM().inverse());
 check(mouth.viewBox.baseVal.width<width&&Math.hypot(a.x-b.x,a.y-b.y)<.01,'口でもホイール拡大とカーソル位置を維持');
 $('mouth').value='.5';$('mouth').dispatchEvent(new w.Event('input',{bubbles:true}));await wait(80);
 check($('mouthDirectHandles').style.display==='none','閉じ口が消えた開き度ではハンドルを隠す');
 d.querySelector('[data-optional-parts]').click();check(!$('partFields').getClientRects().length,'レイヤー未選択ではパーツ設定を出さない');
 d.querySelector('#layers .layer').click();check(d.body.dataset.editStep==='parts'&&$('partFields').getClientRects().length,'選択したパーツだけ編集');
 $('editNext').click();const t=$('timeValue').textContent;await wait(350);
 check(d.body.dataset.task==='motion'&&$('timeValue').textContent!==t,'動きの工程で再生を再開');
 d.querySelector('#workflowNav [data-tab="edit"]').click();
 document.body.dataset.result='pass';
}catch(e){log.push('FAIL '+e.message);output.textContent=log.join('\n');document.body.dataset.result='fail';}
</script></html>

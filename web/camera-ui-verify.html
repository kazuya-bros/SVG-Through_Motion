<!doctype html><meta charset="utf-8"><title>カメラUI検証</title><button id="run">検証（実カメラは使いません）</button><pre id="result">待機中</pre><iframe id="app" src="/?project=c26d17f5b56a40818e2adaf3626b51d9" style="width:1100px;height:800px"></iframe>
<script type="module">
const frame=document.querySelector('#app'),out=document.querySelector('#result'),wait=ms=>new Promise(r=>setTimeout(r,ms));
document.querySelector('#run').onclick=async()=>{
 let original,media,feed,timer;
 try{
  const w=frame.contentWindow,d=frame.contentDocument,$=id=>d.getElementById(id);
  for(let i=0;i<300&&!d.querySelector('canvas.rig-preview');i++)await wait(100);
  media=w.navigator.mediaDevices;original=media.getUserMedia;
  const canvas=d.createElement('canvas');canvas.width=320;canvas.height=240;
  const ctx=canvas.getContext('2d');timer=setInterval(()=>{ctx.fillStyle='#aaa';ctx.fillRect(0,0,320,240);},100);
  media.getUserMedia=async()=>{feed=canvas.captureStream(10);return feed;};
  d.querySelector('#workspaceMode').click();d.querySelector('[data-live-page=tracking]').click();
  const log=[],check=(ok,text)=>{if(!ok)throw Error(text);log.push('PASS '+text);out.textContent=log.join('\n');};
  let attempt=$('startTracking').onclick();
  check(!$('stopTracking').disabled&&$('stopTracking').textContent==='開始をキャンセル','準備中もキャンセル可能');
  $('stopTracking').click();await attempt;
  check(!$('startTracking').disabled&&$('camera').srcObject===null,'キャンセルで再試行可能');
  await $('startTracking').onclick();
  check($('camera').srcObject===feed&&feed?.active&&$('camera').readyState>=2,'実モデルと模擬カメラ映像で起動成功');
  for(let i=0;i<100&&$('trackL').textContent==='—';i++)await wait(100);
  check($('trackL').textContent!=='—','Workerの解析結果を画面へ反映');
  $('stopTracking').click();check(!feed.active&&$('camera').srcObject===null&&!$('startTracking').disabled,'停止で映像と解析を解放');
  media.getUserMedia=async()=>{throw new w.DOMException('denied','NotAllowedError');};
  await $('startTracking').onclick();check($('cameraStatus').textContent.includes('許可されていません')&&!$('startTracking').disabled,'権限拒否をカメラ欄で案内し再試行可能');
  document.body.dataset.result='pass';
 }catch(error){out.textContent+='\nFAIL '+error.message;document.body.dataset.result='failed';}
 finally{if(original)media.getUserMedia=original;feed?.getTracks().forEach(t=>t.stop());clearInterval(timer);}
};
</script>

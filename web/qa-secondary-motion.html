<!doctype html><meta charset="utf-8"><title>Secondary motion renderer checks</title><pre id="result">Running</pre><script type="module">
import {prepareCanvasRenderer} from '/web/canvas-renderer.js';
import {loopPose} from '/web/motion.js';
const results=[];
try {
 for(const [name,role] of [['bottomwear','static'],['wings','static'],['neckwear','static'],['earwear','static'],['eyebrow-l','brow-l']]){
  const part={id:'p1',name,role,visible:true,opacity:1,x:35,y:25,width:70,height:80,pivotX:70,pivotY:25,independentAccessory:role==='static',secondaryMotion:{enabled:true,amount:100,cycles:1,range:50},svgText:'<svg xmlns="http://www.w3.org/2000/svg" width="70" height="80"><rect width="70" height="80" fill="#d67240"/></svg>'};
  const p={width:140,height:140,parts:[part],settings:{duration:6,background:'transparent',eyeThroughHair:true}};
  p.parts.push(...[['white','white-l'],['lash','lash-l'],['front','static']].map(([id,role])=>({id,role,name:id,visible:true,opacity:1,x:0,y:0,width:10,height:10,...(id==='front'?{deformGroup:'front'}:{}),svgText:'<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><rect width="10" height="10" fill="#333"/></svg>'})));
  const initial=part.secondaryMotion;delete part.secondaryMotion;
  const renderer=await prepareCanvasRenderer(p,140);
  part.secondaryMotion={...initial};
  const bytes=()=>Array.from(renderer.canvas.getContext('2d').getImageData(0,0,140,140).data).join(',');
  renderer.draw({...loopPose(0,p.settings),mouth:0});const start=bytes();
  renderer.draw({...loopPose(1.5,p.settings),mouth:1});const moved=bytes();
  renderer.draw({...loopPose(6,p.settings),mouth:0});const end=bytes();
  const a=start.split(',').map(Number),b=end.split(',').map(Number);results.push(name+' delta: '+a.reduce((s,v,i)=>s+Math.abs(v-b[i]),0)+' / max '+Math.max(...a.map((v,i)=>Math.abs(v-b[i]))));
  if(start===moved||Math.max(...a.map((v,i)=>Math.abs(v-b[i])))>1||a.reduce((s,v,i)=>s+Math.abs(v-b[i]),0)>100)throw Error(name+' failed motion/loop raster check moved='+String(start!==moved)+' loop='+String(start===end)+' nonzero='+String(start.split(',').filter(v=>v!=='0').length));
  part.secondaryMotion={...part.secondaryMotion,enabled:false};renderer.draw({...loopPose(0,p.settings),mouth:0});const off=bytes();
  renderer.draw({...loopPose(1.5,p.settings),mouth:1});const after=bytes();if(after!==off)throw Error(name+' failed OFF stability');
  renderer.dispose();results.push(name+': moved, seamless, live first ON/replaced OFF through cached eye-through passes (PASS)');
 }
 document.getElementById('result').textContent=results.join('\n');
}catch(e){document.getElementById('result').textContent=results.join('\n')+'\nFAIL '+e.stack;}
</script>

<!doctype html><meta charset="utf-8"><title>顔の向き・顎の確認</title>
<style>body{font:14px sans-serif;background:#eee}main{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}figure{margin:0;background:white}canvas,img{width:100%}pre{white-space:pre-wrap}</style>
<h1>顔のXYZ・口に連動する顎</h1><pre id="result">準備中</pre><main></main>
<script type="module">
import {prepareCanvasRenderer} from './canvas-renderer.js';
import {animatedSvg,applyPose} from './motion.js';
import {normalizeRig} from './rig.js';
import {sanitizeSvg} from './assets.js';
const log=t=>document.querySelector('#result').textContent+='\n'+t;
const parse=s=>new DOMParser().parseFromString(s,'image/svg+xml').documentElement;
try{
 const p=await(await fetch('./samples/teth/project.json')).json();
 p.settings={...p.settings,rigEnabled:true,independentHair:true,headYaw:1,background:'white'};p.rig=normalizeRig(p.rig,p);
 for(const [i,a] of p.parts.entries()){a.svgText=sanitizeSvg(a.svgText,`qa${i}-`);}
 const renderer=await prepareCanvasRenderer(p,1024);
 const poses=[['正面',{}],['左向き',{yaw:-1}],['右向き',{yaw:1}],['上向き',{pitch:1}],['傾き',{headRoll:8}],['口・顎',{mouth:1}]];
 for(const [name,pose] of poses){renderer.draw(pose);const fig=document.createElement('figure'),c=document.createElement('canvas'),label=document.createElement('figcaption');c.width=440;c.height=390;c.getContext('2d').drawImage(renderer.canvas,295,170,440,390,0,0,440,390);label.textContent=name;fig.append(label,c);document.querySelector('main').append(fig);}
 log('PASS 実サンプル6ポーズ');
 const fixture={width:400,height:400,settings:{rigEnabled:true,independentHair:true,duration:4,headYaw:1,background:'white'},parts:[{id:'face',role:'static',deformGroup:'core',visible:true,opacity:1,x:0,y:0,width:400,height:400,svgText:'<svg xmlns="http://www.w3.org/2000/svg"><ellipse cx="200" cy="150" rx="62" ry="76" fill="#ffaaaa"/><circle cx="183" cy="149" r="5"/><circle cx="220" cy="149" r="5"/><rect x="145" y="250" width="110" height="100" fill="blue"/></svg>'}]};
 fixture.rig=normalizeRig({faceX:200,faceY:150,faceWidth:140,neckX:200,neckY:240,segmented:true},fixture);
 const root=parse(animatedSvg(fixture,fixture.settings,parse));root.querySelectorAll('animate,animateTransform').forEach(a=>a.remove());
 const hashes=[],centers=[];let body=null;
 for(const pose of [{},{yaw:1},{pitch:1},{headRoll:8},{mouth:1}]){applyPose(root,pose,fixture);const im=new Image();im.src=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(root)],{type:'image/svg+xml'}));await im.decode();const c=document.createElement('canvas');c.width=c.height=400;const ctx=c.getContext('2d');ctx.drawImage(im,0,0);const b=ctx.getImageData(0,0,400,400).data;let n=0,count=0,cx=0,cy=0;for(let i=0;i<b.length;i++){n=(n*31+b[i])>>>0;if(i%4===0&&b[i]>220&&b[i+1]<210&&b[i+2]<210){count++;cx+=(i/4)%400;cy+=Math.floor(i/1600);}}hashes.push(n);centers.push([cx/count,cy/count]);const crop=ctx.getImageData(130,270,140,90).data;if(body&&body.some((v,i)=>v!==crop[i]))throw Error('SVGの顔変形で身体が動いた');body=crop;URL.revokeObjectURL(im.src);}
 if(new Set(hashes).size!==5)throw Error('SVGのXYZ/顎が動いていません '+hashes);
 if(!(centers[1][0]>centers[0][0]+2&&centers[2][1]<centers[0][1]-1))throw Error('SVGの向きが逆');
 log('PASS 単体SVGのXYZ・顎も5通りに変化、身体は不変');
 const start=performance.now(),text=animatedSvg(p,p.settings,parse),full=parse(text),runs=full.querySelectorAll('[filter="url(#face-local)"]').length;
 if(runs>3)throw Error('顔フィルターの過剰な重複');
 const image=new Image();image.src=URL.createObjectURL(new Blob([text],{type:'image/svg+xml'}));await image.decode();
 log('PASS 実サンプルのSVG描画 '+Math.round(performance.now()-start)+'ms / 顔の描画 '+runs+'回');renderer.dispose();URL.revokeObjectURL(image.src);
}catch(e){log('FAIL '+e.stack);}
</script>

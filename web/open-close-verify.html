<!doctype html><meta charset="utf-8"><title>開閉モード検証</title><button id="run">保存互換とUIを検証</button><pre id="result">待機中</pre><iframe id="app" src="/?project=0d9a9ee25458485390823861b91094c1" style="width:1150px;height:800px"></iframe>
<script type="module">
import {svgSignature} from './raster-source.js';
const f=document.querySelector('#app'),out=document.querySelector('#result'),wait=ms=>new Promise(r=>setTimeout(r,ms));
document.querySelector('#run').onclick=async()=>{
 let originalFetch,w;
 try{
  w=f.contentWindow;const d=f.contentDocument,$=id=>d.getElementById(id),log=[];
  const check=(v,s)=>{if(!v)throw Error(s);log.push('PASS '+s);out.textContent=log.join('\n');};
  for(let i=0;i<300&&!d.querySelector('canvas.rig-preview');i++)await wait(100);
  const source=await(await fetch('/api/exports/0d9a9ee25458485390823861b91094c1/khaula-motion.project.json')).json();source.settings.vowels=true;
  const mod=await w.eval("import('/web/app.js?v=workspace-2')");mod.adoptProject(structuredClone(source));
  check(!$('vowels').checked&&$('vowelOptions').hidden,'母音ONの旧保存も開閉で開く');
  check($('importVowelOptions').hidden&&[...d.querySelectorAll('[data-face-donor]')].filter(e=>/mouth_[aiueo]$/.test(e.dataset.faceDonor)).every(e=>e.disabled),'母音追加を非表示・送信無効');
  d.querySelector('[data-edit-page=mouth]').click();
  check([...$('mouthShape').options].filter(o=>!o.hidden).map(o=>o.value).join(',')==='closed,open','口の編集は閉じ口と開き口だけ');
  d.querySelector('#workflowNav [data-tab=motion]').click();d.querySelector('#motionVoice').click();
  check($('speechReading').closest('label').hidden,'読み仮名欄は非表示');
  let saved;originalFetch=w.fetch.bind(w);w.fetch=async(url,options={})=>{if(String(url).startsWith('/api/exports/')&&options.method==='POST'){saved=JSON.parse(await options.body.text());return new w.Response(JSON.stringify({url:'/test-only',path:'test-only'}),{headers:{'content-type':'application/json'}});}return originalFetch(url,options);};
  await $('saveProject').onclick();
  check(saved.settings.vowels===false&&saved.settings.lipSyncMode==='open-close','保存・OBS・出力へ渡す設定も開閉');
  for(const p of source.parts){const after=saved.parts.find(v=>v.id===p.id);for(const [key,svg] of Object.entries(p.mouthVariants||{}))check(await svgSignature(svg)===await svgSignature(after.mouthVariants[key]),'既存の母音SVGを保持 '+key);}
  check(JSON.stringify(source.settings.mouthTuning.vowels)===JSON.stringify(saved.settings.mouthTuning.vowels),'母音の調整値を保持');
  document.body.dataset.result='pass';
 }catch(e){out.textContent+='\nFAIL '+e.message;document.body.dataset.result='failed';}
 finally{if(originalFetch)w.fetch=originalFetch;}
};
</script>

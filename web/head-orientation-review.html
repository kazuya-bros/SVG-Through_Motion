<!doctype html><html lang="ja"><meta charset="utf-8"><title>頭の向きの描画確認</title>
<style>body{margin:24px;font:16px system-ui;color:#25364a;background:#eef1f5}h1{font-size:23px}p{color:#64748b}main{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:1440px}figure{margin:0;background:white;border:1px solid #d7deeb;border-radius:12px;overflow:hidden}canvas{display:block;width:100%}figcaption{text-align:center;padding:14px;font-weight:600}#status{font-size:13px}</style>
<h1>Teth2 — 頭全体の向きを確認</h1><p>同じフレームで、顔の輪郭・髪・頭飾りが一緒に動くか比較します。</p><div id="status">描画を準備しています…</div><main></main>
<script type="module">
import {prepareCanvasRenderer} from './canvas-renderer.js';
import {loopPose} from './motion.js';
const p=await(await fetch('./samples/teth/project.json')).json();
p.settings={...p.settings,rigEnabled:true,independentHair:true,headTilt:0,headYaw:0,headPitch:0,headNod:0,sway:0,breathe:0,chest:0,frontHair:0,backHair:0,armSwing:0,earAmount:0,talking:false,blink:false};
const renderer=await prepareCanvasRenderer(p,1024);
for(const [label,yaw,pitch] of [['正面',0,0],['右を向く',1,0],['うつむく',0,-1],['上を向く',0,1]]){
  renderer.draw({...loopPose(0,p.settings),yaw,pitch});
  const f=document.createElement('figure'),c=document.createElement('canvas'),caption=document.createElement('figcaption');c.width=560;c.height=660;
  c.getContext('2d').drawImage(renderer.canvas,230,0,560,660,0,0,560,660);caption.textContent=label;f.append(c,caption);document.querySelector('main').append(f);
}
renderer.dispose();document.querySelector('#status').textContent='実際のプレビューレンダラーで描画（向きの値は最大）';
</script></html>
